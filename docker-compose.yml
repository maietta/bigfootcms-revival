services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - APP_ENV=development
      - VITE_DEV_SERVER=http://host.docker.internal:5173
    ports:
      - 80:80
    volumes:
      - ./backend:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"