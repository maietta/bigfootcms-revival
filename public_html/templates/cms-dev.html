<script type="module">
    // First import the Vite client for HMR
    import 'http://localhost:5173/@vite/client';
    
    // Then import the mount function from your app
    import { mount } from 'http://localhost:5173/src/main.ts';
    
    // Initialize the CMS when DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
        const mountPoint = document.getElementById('cms-mount');
        if (mountPoint) {
            mount(mountPoint);
        }
    });
</script>
